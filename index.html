<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221a3b">
  <meta name="description" content="dongeng sebelum boboo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="dongeng boboo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>dongeng sebelum boboo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Semua warna SOLID. Tidak ada gradasi di mana pun. */
    :root {
      --malam: #221a3b;
      --malam2: #2d2350;
      --panel: #33275c;
      --chip: #43347a;
      --teks: #fff3e2;
      --redup: #b9aed6;
      --tinta: #2a1d44;
      --pink: #ff9db8;
      --kuning: #ffd36b;
      --mint: #86e0c0;
      --biru: #8fc2ff;
      --jingga: #ffaf7a;
      --acc: var(--pink);
      --gelap: color-mix(in srgb, var(--acc) 62%, #1a0f2e);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      background: var(--malam);
      color: var(--teks);
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.02rem;
      line-height: 1.5;
      padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px);
      -webkit-tap-highlight-color: transparent;
    }

    h1,
    h2,
    .judul {
      font-family: "Chewy", "Baloo 2", system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: .01em
    }

    button {
      font: inherit;
      color: inherit
    }

    svg[hidden] {
      display: none
    }

    .ic {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -.2em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .kartu .ikon,
    .sampul .ikon,
    .lanjut .ikon {
      color: var(--tinta)
    }

    /* ikon dongeng dibuat "gemuk": ada isiannya */
    .kartu .ikon .ic,
    .sampul .ikon .ic,
    .lanjut .ikon .ic {
      fill: currentColor;
      fill-opacity: .22
    }

    .kartu .ikon .ic {
      width: 30px;
      height: 30px
    }

    .sampul .ikon .ic {
      width: 58px;
      height: 58px
    }

    .lanjut .ikon .ic {
      width: 30px;
      height: 30px
    }

    .tombol-pojok .ic {
      width: 24px;
      height: 24px
    }

    .panel h3 .ic {
      width: 1.2em;
      height: 1.2em;
      margin-right: 6px;
      color: var(--acc)
    }

    .info .ic {
      width: 1em;
      height: 1em;
      margin-right: 2px
    }

    .penutup .judul .ic {
      width: 1.1em;
      height: 1.1em
    }

    .fav .ic {
      display: none
    }

    main {
      max-width: 540px;
      margin: 0 auto;
      padding: 26px 20px 40px;
      position: relative;
      z-index: 1
    }

    /* ---------- langit ---------- */
    .bintang {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0
    }

    .bintang i {
      position: absolute;
      background: var(--kuning);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: kedip 3.4s ease-in-out infinite;
    }

    @keyframes kedip {
      50% {
        opacity: .25;
        transform: scale(.55) rotate(25deg)
      }
    }

    .redupan {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .4s
    }

    body.redup .redupan {
      opacity: .45
    }

    /* ---------- header ---------- */
    header {
      text-align: center;
      margin-bottom: 26px;
      position: relative
    }

    .bulan {
      width: 108px;
      height: 108px;
      margin: 8px auto 14px;
      border-radius: 50%;
      background: var(--kuning);
      position: relative;
      transform: rotate(-8deg);
      animation: goyang 6s ease-in-out infinite;
    }

    @keyframes goyang {
      50% {
        transform: rotate(6deg)
      }
    }

    /* mata ngantuk */
    .bulan::before,
    .bulan::after {
      content: "";
      position: absolute;
      top: 46px;
      width: 15px;
      height: 8px;
      border-bottom: 4px solid var(--tinta);
      border-radius: 0 0 15px 15px;
    }

    .bulan::before {
      left: 27px
    }

    .bulan::after {
      right: 27px
    }

    .bulan span {
      position: absolute;
      left: 50%;
      top: 66px;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: var(--tinta);
    }

    .bulan b {
      position: absolute;
      top: 60px;
      width: 17px;
      height: 11px;
      border-radius: 50%;
      background: var(--pink);
      opacity: .85
    }

    .bulan b:nth-of-type(1) {
      left: 12px
    }

    .bulan b:nth-of-type(2) {
      right: 12px
    }

    .zz {
      position: absolute;
      left: calc(50% + 52px);
      top: -4px;
      font-family: "Chewy", sans-serif;
      color: var(--biru);
      font-size: 1.9rem;
      pointer-events: none;
      transform: rotate(10deg);
      animation: melayang 3.2s ease-in-out infinite;
    }

    .zz i {
      font-style: normal;
      font-size: 1.2rem;
      margin-left: 2px;
      color: var(--mint)
    }

    @keyframes melayang {
      50% {
        transform: translateY(-8px) rotate(2deg)
      }
    }

    h1 {
      font-size: 2.3rem;
      margin: 0 0 2px;
      color: var(--kuning);
      transform: rotate(-1.5deg);
    }

    .sapa {
      margin: 0;
      color: var(--redup)
    }

    .chips-info {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .info {
      background: var(--chip);
      border-radius: 14px 14px 14px 5px;
      padding: 3px 12px;
      font-size: .9rem;
      font-weight: 600;
      color: var(--kuning);
    }

    .info:nth-child(2) {
      border-radius: 14px 14px 5px 14px;
      color: var(--pink)
    }

    .tombol-pojok {
      position: absolute;
      right: 0;
      top: 0;
      width: 46px;
      height: 46px;
      border-radius: 16px 16px 16px 6px;
      background: var(--chip);
      border: 0;
      cursor: pointer;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .tombol-pojok:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .tombol-pojok[aria-pressed="true"] {
      background: var(--kuning);
      color: var(--tinta)
    }

    /* ---------- pesan malam: kertas sticky ---------- */
    .pesan {
      background: var(--kuning);
      color: var(--tinta);
      border-radius: 6px 6px 22px 6px;
      padding: 18px 20px 16px;
      margin: 0 6px 24px;
      transform: rotate(1.3deg);
      position: relative;
      box-shadow: 4px 6px 0 rgba(0, 0, 0, .22);
    }

    .pesan::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 70px;
      height: 20px;
      margin-left: -35px;
      background: var(--pink);
      opacity: .9;
      transform: rotate(-4deg);
    }

    .pesan small {
      display: block;
      font-family: "Chewy", sans-serif;
      color: #a8521f;
      font-size: .95rem;
      margin-bottom: 0
    }

    .pesan p {
      margin: 0;
      font-weight: 600;
      line-height: 1.4
    }

    /* ---------- lanjutkan ---------- */
    .lanjut {
      display: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      margin-bottom: 22px;
      background: var(--mint);
      color: var(--tinta);
      border: 0;
      border-radius: 28px 28px 8px 28px;
      padding: 14px 18px;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 0 #4aa88a;
      transition: transform .1s, box-shadow .1s;
    }

    .lanjut:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4aa88a
    }

    .lanjut.tampil {
      display: flex
    }

    .lanjut small {
      display: block;
      font-weight: 700;
      opacity: .75;
      line-height: 1.2
    }

    .lanjut .judul {
      font-size: 1.25rem;
      display: block
    }

    .lanjut svg {
      margin-left: auto;
      flex: none
    }

    /* ---------- cari & filter ---------- */
    .alat {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .cari {
      flex: 1 1 180px;
      min-width: 0;
      background: white;
      color: var(--teks);
      border: 0;
      border-radius: 20px 20px 20px 6px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
    }

    .cari::placeholder {
      color: var(--redup);
      font-weight: 400
    }

    .cari:focus {
      outline: 3px solid var(--pink);
      outline-offset: 2px
    }

    .filter {
      display: flex;
      gap: 8px
    }

    .filter button {
      background: var(--chip);
      border: 0;
      border-radius: 18px 18px 6px 18px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 700;
      color: var(--redup);
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .filter button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .filter button.aktif {
      background: var(--pink);
      color: var(--tinta)
    }

    /* ---------- daftar: kartu warna-warni tanpa garis ---------- */
    .daftar {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 16px
    }

    .daftar li {
      position: relative
    }

    .kartu {
      width: 100%;
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: left;
      background: var(--acc);
      color: var(--tinta);
      border: 0;
      border-radius: 34px 18px 34px 18px / 26px 30px 24px 32px;
      padding: 14px 62px 14px 14px;
      cursor: pointer;
      transform: rotate(-.7deg);
      transition: transform .18s cubic-bezier(.3, 1.6, .5, 1);
    }

    .daftar li:nth-child(even) .kartu {
      transform: rotate(.6deg);
      border-radius: 18px 34px 18px 34px / 30px 24px 32px 26px;
    }

    /* hanya sebagian kartu yang punya garis putus-putus, sisanya polos */
    .daftar li:nth-child(3n) .kartu {
      background: transparent;
      color: var(--teks);
      outline: 3px dashed var(--acc);
      outline-offset: -3px;
    }

    .daftar li:nth-child(3n) .kartu small {
      color: var(--redup)
    }

    .daftar li:nth-child(3n) .kartu .ikon {
      background: var(--acc)
    }

    .daftar li:nth-child(3n) .mini {
      background: var(--malam2)
    }

    .daftar li:nth-child(3n) .mini i {
      background: var(--acc)
    }

    .daftar li:nth-child(3n) .fav svg {
      stroke: var(--redup)
    }

    .kartu:hover,
    .kartu:focus-visible {
      transform: rotate(0) scale(1.03) !important;
      outline-color: var(--acc);
    }

    .kartu:focus-visible {
      outline: 3px solid var(--teks);
      outline-offset: 3px
    }

    .kartu:active {
      transform: scale(.97) !important
    }

    .kartu .ikon {
      flex: none;
      width: 58px;
      height: 58px;
      border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%;
      background: rgba(255, 255, 255, .55);
      display: grid;
      place-items: center;
    }

    .kartu .judul {
      font-size: 1.3rem;
      display: block
    }

    .kartu small {
      color: rgba(42, 29, 68, .72);
      display: block;
      font-weight: 600;
      line-height: 1.2
    }

    .mini {
      height: 7px;
      border-radius: 7px;
      background: rgba(42, 29, 68, .18);
      margin-top: 8px;
      overflow: hidden;
      display: none
    }

    .mini.tampil {
      display: block
    }

    .mini i {
      display: block;
      height: 100%;
      background: var(--tinta);
      border-radius: 7px
    }

    .fav {
      position: absolute;
      right: 10px;
      top: 50%;
      margin-top: -22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .fav svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--tinta);
      stroke-width: 2.4;
      stroke-linejoin: round;
      transition: transform .2s cubic-bezier(.3, 1.8, .5, 1)
    }

    .fav[aria-pressed="true"] svg {
      fill: #e0245e;
      stroke: #e0245e;
      transform: scale(1.2) rotate(-8deg)
    }

    .fav:focus-visible {
      outline: 3px solid var(--teks)
    }

    .kosong {
      text-align: center;
      color: var(--redup);
      padding: 26px 0;
      display: none
    }

    /* ---------- cover dongeng (gambar dari dongengnya, fallback ke ikon) ---------- */
    .kartu .ikon,
    .sampul .ikon {
      position: relative;
      overflow: hidden
    }

    .ikon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .kartu .ikon.ada-gambar {
      width: 70px;
      height: 70px
    }

    .sampul .ikon.ada-gambar {
      width: 176px;
      height: 176px;
      margin-bottom: 16px
    }

    .kartu.segera {
      opacity: .78
    }

    .daftar li:nth-child(3n) .kartu.segera {
      opacity: .85
    }

    /* tombol pasang aplikasi (muncul kalau browser mendukung) */
    .pasang {
      display: none;
      margin: 14px auto 0;
      background: var(--mint);
      color: var(--tinta);
      border: 0;
      border-radius: 18px 18px 18px 6px;
      padding: 7px 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #4aa88a;
      transition: transform .1s, box-shadow .1s
    }

    .pasang.tampil {
      display: block
    }

    .pasang:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4aa88a
    }

    .pasang-ios {
      display: none;
      margin: 12px auto 0;
      max-width: 330px;
      background: var(--malam2);
      border-radius: 18px;
      padding: 8px 14px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--redup)
    }

    .pasang-ios.tampil {
      display: block
    }

    /* ---------- detail ---------- */
    #detail {
      display: none
    }

    .kembali {
      background: var(--chip);
      border: 0;
      color: var(--teks);
      cursor: pointer;
      padding: 6px 16px;
      margin-bottom: 14px;
      border-radius: 16px 16px 16px 5px;
      font-weight: 700;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .kembali:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    button:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 3px
    }

    .sampul {
      text-align: center
    }

    .sampul .ikon {
      width: 112px;
      height: 112px;
      border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%;
      background: var(--acc);
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      transform: rotate(-5deg);
    }

    .sampul h2 {
      font-size: 2rem;
      margin: 0 0 18px;
      color: var(--acc)
    }

    /* pembuka = gelembung bicara */
    .pembuka {
      background: var(--malam2);
      border-radius: 26px 26px 26px 26px;
      padding: 16px 20px;
      margin: 0 0 30px;
      color: var(--teks);
      font-weight: 600;
      position: relative;
    }

    .pembuka::after {
      content: "";
      position: absolute;
      left: 34px;
      bottom: -16px;
      width: 26px;
      height: 20px;
      background: var(--malam2);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .panel {
      background: var(--panel);
      border-radius: 28px 28px 28px 10px;
      padding: 18px 18px 20px;
      margin-bottom: 18px
    }

    .panel:nth-of-type(even) {
      border-radius: 28px 28px 10px 28px
    }

    .panel h3 {
      margin: 0 0 12px;
      font-family: "Chewy", sans-serif;
      font-weight: 400;
      font-size: 1.15rem;
      line-height: 1.25;
      color: var(--teks)
    }

    /* pemutar */
    .bar {
      position: relative;
      height: 34px;
      display: flex;
      align-items: center
    }

    .bar .jalur {
      position: absolute;
      left: 0;
      right: 0;
      height: 14px;
      border-radius: 14px;
      background: var(--malam)
    }

    .bar .isi {
      position: absolute;
      left: 0;
      height: 14px;
      border-radius: 14px;
      background: var(--acc);
      width: 0
    }

    .bar .titik {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--teks);
      margin-left: -13px;
      left: 0;
      box-shadow: 0 3px 0 var(--gelap)
    }

    .bar input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer
    }

    .bar:focus-within .titik {
      outline: 3px solid var(--teks);
      outline-offset: 2px
    }

    .waktu {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      font-weight: 600;
      color: var(--redup);
      font-variant-numeric: tabular-nums
    }

    .kontrol {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 12px
    }

    .kontrol button {
      background: var(--chip);
      border: 0;
      cursor: pointer;
      width: 54px;
      height: 54px;
      border-radius: 20px 20px 20px 8px;
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 5px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .kontrol button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #17102b
    }

    .kontrol button svg {
      width: 28px;
      height: 28px;
      fill: var(--teks)
    }

    .kontrol button small {
      position: absolute;
      font-size: .62rem;
      font-weight: 700;
      top: 19px;
      left: 0;
      right: 0;
      text-align: center
    }

    .kontrol .main {
      width: 76px;
      height: 76px;
      background: var(--acc);
      border-radius: 50% 50% 50% 22%;
      box-shadow: 0 6px 0 var(--gelap);
    }

    .kontrol .main:active {
      box-shadow: 0 2px 0 var(--gelap)
    }

    .kontrol .main svg {
      width: 34px;
      height: 34px;
      fill: var(--tinta)
    }

    .kecepatan {
      width: auto !important;
      height: 40px !important;
      padding: 0 18px;
      border-radius: 16px 16px 16px 6px !important;
      font-weight: 700;
      font-size: .95rem;
      box-shadow: 0 4px 0 #17102b !important;
    }

    /* chip pilihan */
    .pilih {
      display: flex;
      gap: 9px;
      flex-wrap: wrap
    }

    .pilih button {
      background: var(--chip);
      border: 0;
      border-radius: 16px 16px 16px 6px;
      padding: 7px 16px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .pilih button:nth-child(even) {
      border-radius: 16px 16px 6px 16px
    }

    .pilih button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .pilih button.aktif {
      background: var(--acc);
      color: var(--tinta);
      box-shadow: 0 4px 0 var(--gelap)
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--redup);
      font-size: .9rem;
      font-weight: 600
    }

    .volume input {
      flex: 1;
      accent-color: var(--acc)
    }

    .sakelar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-weight: 700
    }

    .sakelar input {
      position: absolute;
      opacity: 0
    }

    .sakelar .rel {
      width: 56px;
      height: 32px;
      border-radius: 32px;
      background: var(--malam);
      position: relative;
      flex: none;
      transition: background .2s
    }

    .sakelar .rel::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--redup);
      transition: transform .25s cubic-bezier(.3, 1.7, .5, 1), background .2s
    }

    .sakelar input:checked+.rel {
      background: var(--mint)
    }

    .sakelar input:checked+.rel::after {
      transform: translateX(24px);
      background: var(--tinta)
    }

    .sakelar input:focus-visible+.rel {
      outline: 3px solid var(--pink);
      outline-offset: 3px
    }

    #status {
      min-height: 1.6em;
      margin: 0 0 16px;
      color: var(--kuning);
      font-weight: 600;
      text-align: center
    }

    .penutup {
      display: none;
      text-align: center;
      padding: 22px 20px;
      border-radius: 30px 30px 8px 30px;
      background: var(--pink);
      color: var(--tinta);
      font-weight: 600;
      transform: rotate(-1deg);
    }

    .penutup .judul {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 4px
    }

    /* pil timer melayang */
    .pil {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 16px);
      transform: translateX(-50%);
      background: var(--kuning);
      color: var(--tinta);
      border-radius: 18px 18px 18px 6px;
      padding: 7px 18px;
      font-weight: 700;
      z-index: 40;
      display: none;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 4px 0 #b88b1c;
    }

    .pil.tampil {
      display: block
    }

    footer {
      text-align: center;
      color: var(--redup);
      font-weight: 600;
      margin-top: 40px
    }

    @media (prefers-reduced-motion:reduce) {

      .bintang i,
      .bulan,
      .zz {
        animation: none
      }

      .kartu,
      .fav svg,
      .redupan,
      button {
        transition: none
      }
    }

    /* =====================================================
       TEMA LIQUID GLASS
       Kaca = isi putih transparan + blur latar + kilau tipis di tepi.
       Tetap tanpa gradasi: semua warna solid, kilau dibuat dari inset shadow.
       Blok ini menimpa gaya di atasnya; hapus blok ini kalau mau balik ke tampilan lama.
       ===================================================== */
    :root {
      --campur: transparent;
      --kaca: rgba(255, 255, 255, .11);
      --kaca2: rgba(255, 255, 255, .18);
      --blur: blur(24px) saturate(1.7);
      --kilap: inset 1.5px 1.5px 1px -.5px rgba(255, 255, 255, .55), inset -1px -1px 1px -.5px rgba(255, 255, 255, .16), inset 0 0 0 1px rgba(255, 255, 255, .09);
      --bayang: 0 10px 30px rgba(8, 4, 24, .35);
      --bayang-kecil: 0 4px 14px rgba(8, 4, 24, .28);
    }

    /* bentuk warna solid di belakang kaca (supaya ada yang diburamkan) */
    .cairan {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0
    }

    .cairan i {
      position: absolute;
      border-radius: 50%;
      opacity: .5;
      animation: hanyut 18s ease-in-out infinite alternate
    }

    .cairan i:nth-child(1) { width: 300px; height: 300px; left: -90px; top: 6%; background: var(--pink) }
    .cairan i:nth-child(2) { width: 240px; height: 240px; right: -70px; top: 30%; background: var(--biru); animation-duration: 22s; animation-delay: -6s }
    .cairan i:nth-child(3) { width: 320px; height: 320px; left: 8%; bottom: -120px; background: var(--mint); animation-duration: 26s; animation-delay: -11s }
    .cairan i:nth-child(4) { width: 170px; height: 170px; right: 12%; bottom: 12%; background: var(--kuning); animation-duration: 20s; animation-delay: -3s }

    @keyframes hanyut {
      to { transform: translate(40px, -60px) scale(1.08) }
    }

    /* teks yang duduk langsung di atas latar */
    h1 { transform: none; text-shadow: 0 2px 14px rgba(8, 4, 24, .5) }
    .sapa { color: var(--teks); opacity: .92 }
    footer { color: var(--teks); opacity: .85 }
    .sampul h2 { text-shadow: 0 2px 14px rgba(8, 4, 24, .5) }
    #status { text-shadow: 0 1px 8px rgba(8, 4, 24, .5) }
    .kosong { color: var(--teks); opacity: .85 }

    /* permukaan kaca besar: blur + kilau */
    .panel, .pembuka, .pesan, .penutup, .kartu, .lanjut, .pil, .pasang-ios, .info, .cari {
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--kilap), var(--bayang);
    }

    .panel, .panel:nth-of-type(even) {
      background: var(--kaca);
      border-radius: 30px
    }

    .pembuka {
      background: var(--kaca);
      border-radius: 28px;
      margin-bottom: 22px
    }

    .pembuka::after { display: none }

    .pesan {
      background: color-mix(in srgb, var(--kuning) 24%, var(--campur));
      color: var(--teks);
      border-radius: 30px;
      transform: none
    }

    .pesan::before { display: none }
    .pesan small { color: var(--kuning) }

    .penutup {
      background: color-mix(in srgb, var(--pink) 28%, var(--campur));
      color: var(--teks);
      border-radius: 30px;
      transform: none
    }

    .lanjut {
      background: color-mix(in srgb, var(--mint) 30%, var(--campur));
      color: var(--teks);
      border-radius: 30px
    }

    .lanjut svg { fill: var(--teks) }
    .lanjut .ikon { color: var(--teks) }

    .lanjut:active {
      transform: scale(.98);
      box-shadow: var(--kilap), var(--bayang)
    }

    .pil {
      background: rgba(34, 26, 59, .5);
      color: var(--kuning);
      border-radius: 999px;
      padding: 8px 20px
    }

    .pasang-ios {
      background: var(--kaca);
      color: var(--teks);
      border-radius: 22px
    }

    .info, .info:nth-child(2) {
      background: var(--kaca);
      color: var(--teks);
      border-radius: 999px;
      padding: 4px 14px;
      box-shadow: var(--kilap)
    }

    .cari {
      background: var(--kaca);
      color: var(--teks);
      border-radius: 999px;
      padding: 11px 20px
    }

    .cari::placeholder { color: rgba(255, 243, 226, .6) }

    /* kartu dongeng: kaca dengan semburat warna aksen */
    .daftar li:nth-child(n) .kartu {
      background: color-mix(in srgb, var(--acc) 26%, var(--campur));
      color: var(--teks);
      outline: 0;
      transform: none;
      border-radius: 30px;
      padding: 12px 60px 12px 12px
    }

    .daftar li:nth-child(n) .kartu:focus-visible {
      outline: 3px solid var(--teks);
      outline-offset: 3px
    }

    .daftar li:nth-child(n) .kartu small { color: rgba(255, 243, 226, .86) }

    .daftar li:nth-child(n) .kartu .ikon {
      background: var(--acc);
      border-radius: 20px;
      box-shadow: var(--kilap)
    }

    .daftar li:nth-child(n) .mini { background: rgba(255, 255, 255, .2) }
    .daftar li:nth-child(n) .mini i { background: var(--acc) }
    .daftar li:nth-child(n) .fav svg { stroke: var(--teks) }
    .daftar li:nth-child(n) .fav[aria-pressed="true"] svg { fill: #ff5c8a; stroke: #ff5c8a }

    /* sampul di halaman dongeng */
    .sampul .ikon {
      border-radius: 40px;
      transform: none;
      background: var(--acc);
      box-shadow: var(--kilap), 0 14px 34px rgba(8, 4, 24, .4)
    }

    /* kontrol kecil di dalam panel: isi transparan tanpa blur sendiri */
    .tombol-pojok, .filter button, .kembali, .kontrol button, .pilih button, .pilih button:nth-child(even), .pasang {
      background: var(--kaca2);
      color: var(--teks);
      border-radius: 18px;
      box-shadow: var(--kilap), var(--bayang-kecil)
    }

    .filter button, .pilih button, .pilih button:nth-child(even) { border-radius: 999px }
    .filter button { color: var(--teks) }

    .tombol-pojok:active, .filter button:active, .kembali:active, .kontrol button:active,
    .kontrol .main:active, .pilih button:active, .pasang:active {
      transform: scale(.94);
      box-shadow: var(--kilap)
    }

    .tombol-pojok[aria-pressed="true"] { background: var(--kuning); color: var(--tinta) }
    .filter button.aktif { background: var(--pink); color: var(--tinta) }

    .pilih button.aktif {
      background: var(--acc);
      color: var(--tinta);
      box-shadow: var(--kilap), var(--bayang-kecil)
    }

    .kontrol .main {
      background: color-mix(in srgb, var(--acc) 82%, var(--campur));
      border-radius: 50%;
      box-shadow: var(--kilap), 0 8px 24px color-mix(in srgb, var(--acc) 40%, transparent)
    }

    .kecepatan {
      border-radius: 999px !important;
      box-shadow: var(--kilap), var(--bayang-kecil) !important
    }

    .pasang { background: color-mix(in srgb, var(--mint) 70%, var(--campur)); color: var(--tinta) }

    /* pemutar, slider, sakelar */
    .bar .jalur { background: rgba(255, 255, 255, .16); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35) }
    .bar .titik { background: #fff; box-shadow: 0 2px 8px rgba(0, 0, 0, .4), inset 0 -2px 3px rgba(0, 0, 0, .12) }
    .waktu, .volume { color: rgba(255, 243, 226, .78) }
    .sakelar .rel { background: rgba(255, 255, 255, .18); box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35) }
    .sakelar .rel::after { background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .35) }
    .sakelar input:checked+.rel::after { background: #fff }

    /* cadangan kalau browser tidak punya backdrop-filter, atau pengguna minta transparansi dikurangi */
    @supports not ((-webkit-backdrop-filter: blur(1px)) or (backdrop-filter: blur(1px))) {
      :root { --campur: #33275c; --kaca: #3d2f6e; --kaca2: #4a3a82 }
    }

    @media (prefers-reduced-transparency: reduce) {
      :root { --campur: #33275c; --kaca: #3d2f6e; --kaca2: #4a3a82 }
      .panel, .pembuka, .pesan, .penutup, .kartu, .lanjut, .pil, .pasang-ios, .info, .cari {
        -webkit-backdrop-filter: none;
        backdrop-filter: none
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .cairan i { animation: none }
    }

    /* ---- timer di bawah pemutar ---- */
    .kontrol.sekunder { gap: 10px; flex-wrap: wrap }
    .kontrol .kecepatan { display: inline-flex; align-items: center; justify-content: center }
    .kontrol .kecepatan .ic { width: 1.15em; height: 1.15em; fill: none; margin-right: 5px }
    .kontrol .kecepatan.aktif { background: var(--acc); color: var(--tinta) }
    .timer-pilihan { margin-top: 14px }
    .timer-pilihan[hidden] { display: none }
    .timer-pilihan:not([hidden]) { animation: muncul .18s ease-out }
    .timer-pilihan .pilih { justify-content: center }
    .kontrol.sekunder { justify-content: center; gap: 6px }
    .kontrol.sekunder .kecepatan { padding: 0 10px; font-size: .84rem; white-space: nowrap }
    .kontrol.sekunder .kecepatan .ic { width: 1.05em; height: 1.05em; margin-right: 3px }
    .timer-pilihan .volume { margin-top: 14px }

    @keyframes muncul {
      from { opacity: 0; transform: translateY(-6px) }
    }

    /* ---- balasan ala chat: [emoji] [pesan] [kirim] ---- */
    #balas { display: none; margin-top: 4px }

    .balas-judul {
      margin: 0 0 8px 8px;
      font-family: "Chewy", "Baloo 2", system-ui, sans-serif;
      font-size: 1.05rem;
      text-shadow: 0 1px 8px rgba(8, 4, 24, .5)
    }

    .wa {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      padding: 6px;
      border-radius: 30px;
      background: var(--kaca);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--kilap), var(--bayang)
    }

    .wa:focus-within { outline: 3px solid color-mix(in srgb, var(--pink) 75%, transparent); outline-offset: 2px }

    .wa textarea {
      flex: 1;
      min-width: 0;
      height: 44px;
      max-height: 112px;
      resize: none;
      overflow-y: auto;
      background: transparent;
      border: 0;
      color: var(--teks);
      font: inherit;
      font-weight: 600;
      line-height: 1.35;
      padding: 10px 4px
    }

    .wa textarea::placeholder { color: rgba(255, 243, 226, .6); font-weight: 400 }
    .wa textarea:focus-visible { outline: none }

    .wa-btn {
      flex: none;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: var(--kaca2);
      color: var(--teks);
      box-shadow: var(--kilap);
      transition: transform .1s
    }

    .wa-btn .ic { width: 24px; height: 24px }
    .wa-btn:active { transform: scale(.9) }
    .wa-btn:disabled { opacity: .5; cursor: not-allowed }
    .wa-btn[aria-expanded="true"], .wa-kirim { background: var(--acc); color: var(--tinta) }

    .wa-tray {
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
      gap: 2px;
      padding: 10px;
      border-radius: 24px;
      background: var(--kaca);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--kilap), var(--bayang)
    }

    .wa-tray[hidden] { display: none }

    .wa-tray button {
      border: 0;
      background: transparent;
      font-size: 1.55rem;
      line-height: 1;
      padding: 8px 0;
      border-radius: 14px;
      cursor: pointer
    }

    .wa-tray button:hover, .wa-tray button:active { background: var(--kaca2) }

    .balas-status {
      margin: 8px 0 0 8px;
      min-height: 1.4em;
      color: var(--kuning);
      font-weight: 600;
      text-shadow: 0 1px 8px rgba(8, 4, 24, .5)
    }

    @media (prefers-reduced-motion: reduce) {
      .timer-pilihan:not([hidden]) { animation: none }
    }

    /* ---- voice note dari aku ---- */
    .vn {
      margin-bottom: 18px;
      padding: 14px 16px 12px;
      border-radius: 26px 26px 26px 10px;
      background: var(--kaca);
      -webkit-backdrop-filter: var(--blur);
      backdrop-filter: var(--blur);
      box-shadow: var(--kilap), var(--bayang)
    }

    .vn[hidden], .vn-teks[hidden], .vn-kontrol[hidden] { display: none }

    /* baris status yang kosong tidak perlu memakan tempat */
    #status:empty { min-height: 0; margin: 0 }

    .vn-label {
      display: block;
      margin-bottom: 4px;
      font-family: "Chewy", "Baloo 2", system-ui, sans-serif;
      font-size: .95rem;
      color: var(--kuning)
    }

    .vn-label .ic { width: 1em; height: 1em; margin-right: 3px }
    .vn-teks { margin: 0; font-weight: 600; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere }

    /* pemutar mungil di sisi bawah kata-kata */
    .vn-kontrol { display: flex; align-items: center; gap: 8px; width: min(100%, 250px); margin: 10px 0 0 auto }

    .vn-play {
      flex: none;
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      background: var(--acc);
      box-shadow: var(--kilap), var(--bayang-kecil);
      transition: transform .1s
    }

    .vn-play:active { transform: scale(.9) }
    .vn-play svg { width: 16px; height: 16px; fill: var(--tinta) }
    .vn-kontrol .bar { flex: 1; min-width: 0; height: 24px }
    .vn-kontrol .bar .jalur, .vn-kontrol .bar .isi { height: 6px }
    .vn-kontrol .bar .titik { width: 14px; height: 14px; margin-left: -7px }
    .vn-waktu { flex: none; font-size: .78rem; font-weight: 600; color: rgba(255, 243, 226, .8); font-variant-numeric: tabular-nums }
  </style>
</head>

<body>

  <div class="cairan" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="bintang" aria-hidden="true" id="bintang"></div>
  <div class="redupan" aria-hidden="true"></div>

  <main>
    <!-- ============ HALAMAN UTAMA ============ -->
    <section id="utama">
      <header>
        <button class="tombol-pojok" id="redup" aria-pressed="false" aria-label="Mode redup" title="Mode redup"><span
            data-ic="kontras"></span></button>
        <div class="bulan" aria-hidden="true"><span></span><b></b><b></b></div>
        <div class="zz" aria-hidden="true">z<i>z</i></div>
        <h1>dongeng sebelum boboo</h1>
        <p class="sapa" id="sapa"></p>
        <div class="chips-info" id="chipsInfo"></div>
        <button class="pasang" id="pasang" type="button">pasang di HP</button>
        <p class="pasang-ios" id="pasangIos">di iPhone: ketuk tombol Bagikan, lalu pilih "Tambah ke Layar Utama" biar bisa dibuka kayak aplikasi.</p>
      </header>

      <div class="pesan"><small>pesan malam ini</small>
        <p id="pesanMalam"></p>
      </div>

      <button class="lanjut" id="lanjut">
        <span class="ikon" id="lanjutIkon"></span>
        <span><small id="lanjutKet"></small><span class="judul" id="lanjutJudul"></span></span>
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#2a1d44" aria-hidden="true">
          <path d="M8 5v14l11-7z" />
        </svg>
      </button>

      <div class="alat">
        <input class="cari" id="cari" type="search" placeholder="cari dongeng…" aria-label="Cari dongeng">
        <div class="filter" id="filter">
          <button class="aktif" data-f="semua">Semua</button>
          <button data-f="fav"><span data-ic="hati"></span> Favorit</button>
        </div>
      </div>

      <ul class="daftar" id="daftar"></ul>
      <p class="kosong" id="kosong">gaa ada yang cocok.</p>
      <footer id="footer"></footer>
    </section>

    <!-- ============ HALAMAN DONGENG ============ -->
    <section id="detail">
      <button class="kembali" id="kembali">← kembali</button>
      <div class="sampul">
        <span class="ikon" id="dIkon"></span>
        <h2 id="dJudul"></h2>
      </div>
      <p class="pembuka" id="dPembuka"></p>

      <div class="panel" id="pemutar">
        <audio id="player" preload="metadata"></audio>
        <div class="bar" id="bar">
          <div class="jalur"></div>
          <div class="isi" id="isi"></div>
          <div class="titik" id="titik"></div>
          <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Posisi audio">
        </div>
        <div class="waktu"><span id="tNow">0:00</span><span id="tDur">0:00</span></div>
        <div class="kontrol">
          <button id="mundur" aria-label="Mundur 15 detik">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1L7 6l5 5V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z" />
            </svg><small>15</small>
          </button>
          <button class="main" id="putar" aria-label="Putar">
            <svg id="icPlay" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg id="icPause" viewBox="0 0 24 24" hidden>
              <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
            </svg>
          </button>
          <button id="maju" aria-label="Maju 15 detik">
            <svg viewBox="0 0 24 24">
              <path d="M12 5V1l5 5-5 5V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8z" />
            </svg><small>15</small>
          </button>
        </div>
        <div class="timer-blok">
          <div class="kontrol sekunder" style="margin-top:14px">
            <button class="kecepatan" id="kecepatan" aria-label="Kecepatan putar">1×</button>
            <button class="kecepatan" id="timerToggle" type="button" aria-expanded="false" aria-controls="timerPilihan"
              aria-label="Timer tidur"><span data-ic="jam"></span><span id="timerLabel">timer</span></button>
            <button class="kecepatan" id="latarToggle" type="button" aria-expanded="false" aria-controls="latarPilihan"
              aria-label="Suara latar"><span data-ic="hujan"></span><span id="latarLabel">latar</span></button>
            <button class="kecepatan" id="autoBtn" type="button" aria-pressed="false"
              aria-label="Putar dongeng selanjutnya otomatis setelah yang ini selesai"><span data-ic="lanjut"></span><span>lanjut</span></button>
            <input type="checkbox" id="autoNext" hidden>
          </div>
          <div class="timer-pilihan" id="timerPilihan" hidden>
            <div class="pilih" id="timerTombol"></div>
          </div>
          <div class="timer-pilihan" id="latarPilihan" hidden>
            <div class="pilih" id="latar"></div>
            <div class="volume"><span>pelan</span><input type="range" id="volLatar" min="0" max="100" value="40"
                aria-label="Volume suara latar"><span>nyaring</span></div>
          </div>
        </div>
      </div>

      <p id="status" role="status"></p>

      <!-- voice note dari aku (opsional per dongeng): teks + pemutar mungil di bawahnya -->
      <div class="vn" id="vnBlok" hidden>
        <audio id="vn" preload="metadata"></audio>

}

const fmt = s => {

    b.querySelector("small").textContent = !d.file ? "segera hadir" : (p && p.t > 3 ? "lanjut dari " + fmt(p.t) : "Ketuk untuk dengerin");

      const m = b.querySelector(".mini"); m.classList.add("tampil");
      m.firstChild.style.width = Math.min(100, p.t / p.d * 100) + "%";
    }
    b.onclick = () => buka(i);
    const f = document.createElement("button");
    f.className = "fav"; f.setAttribute("aria-label", "Favorit: " + d.judul);
    f.setAttribute("aria-pressed", favs.includes(d.judul));

    f.onclick = () => { toggleFav(d.judul); };
    li.append(b, f); ul.appendChild(li);
  });
  $("kosong").style.display = n ? "none" : "block";
  $("kosong").textContent = memuat ? "lagi ambil dongengnyaa…"
    : !dongeng.length ? "belum adaa dongeng nyaa, tunggu yaa sayangg."
    : filterMode === "fav" && !kataCari ? "yahh belum adaa yang kamuu jadiin favorit. ketuk ikon hati nyaa di dongeng yang kamu sukaa, kaloo perluu semuanyaa, hahahaha."
    : "belum ada yang cocok.";
  // tombol lanjutkan
  const t = dongeng.findIndex(d => d.judul === terakhir);
  const L = $("lanjut");
  if (t >= 0 && progres[terakhir] && progres[terakhir].t > 3) {
    $("lanjutIkon").innerHTML = ic(dongeng[t].ikon);

let kecepatanIdx = 1; const KEC = [0.8, 1, 1.25, 1.5];
let pulihPosisi = null, simpanTerakhir = 0;

function ikonPlay(main){
  $("icPlay").toggleAttribute("hidden", !main);
  $("icPause").toggleAttribute("hidden", main);
  $("putar").setAttribute("aria-label", main ? "Putar" : "Jeda");
}
  
function perbaruiBar(){
  const d = player.duration || 0, t = player.currentTime || 0;
  const p = d ? t / d * 100 : 0;
  $("isi").style.width = p + "%"; $("titik").style.left = p + "%";
  $("seek").value = d ? Math.round(t / d * 1000) : 0;
  $("tNow").textContent = fmt(t); $("tDur").textContent = fmt(d);
}
function simpanProgres(paksa){
  if (aktif < 0 || !player.duration) return;
  const now = Date.now(); if (!paksa && now - simpanTerakhir < 2000) return;
  simpanTerakhir = now;
  const j = dongeng[aktif].judul;
  progres[j] = { t: player.currentTime, d: player.duration };
  terakhir = j; LS.set("dongeng.progres", progres); LS.set("dongeng.terakhir", j);
}
function sesiMedia(){
  if (!("mediaSession" in navigator) || aktif < 0) return;
  try {
    const dd = dongeng[aktif];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: dd.judul, artist: NAMA_KAMU, album: "dongeng sebelum boboo",
      artwork: dd.gambar ? [{ src: dd.gambar }] : []
    });
    navigator.mediaSession.setActionHandler("play", () => player.play());
    navigator.mediaSession.setActionHandler("pause", () => player.pause());
    navigator.mediaSession.setActionHandler("seekbackward", () => geser(-15));
    navigator.mediaSession.setActionHandler("seekforward", () => geser(15));
    const sel = cariLain(aktif, 1), sbl = cariLain(aktif, -1);
    navigator.mediaSession.setActionHandler("nexttrack", sel >= 0 ? () => buka(sel, true) : null);
    navigator.mediaSession.setActionHandler("previoustrack", sbl >= 0 ? () => buka(sbl, true) : null);
  } catch {}
}
function geser(s){ if (player.duration) player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + s)); }

$("putar").onclick = () => player.paused ? player.play().catch(() => {}) : player.pause();
$("mundur").onclick = () => geser(-15);
$("maju").onclick = () => geser(15);
$("kecepatan").onclick = () => {
  kecepatanIdx = (kecepatanIdx + 1) % KEC.length;
  player.playbackRate = KEC[kecepatanIdx];
  $("kecepatan").textContent = KEC[kecepatanIdx] + "×";
};
$("seek").oninput = e => { if (player.duration) player.currentTime = e.target.value / 1000 * player.duration; };

player.addEventListener("loadedmetadata", () => {
  if (pulihPosisi != null && pulihPosisi < player.duration - 3) player.currentTime = pulihPosisi;
  pulihPosisi = null; perbaruiBar();
});
player.addEventListener("timeupdate", () => { perbaruiBar(); simpanProgres(false); });
player.addEventListener("play", () => { ikonPlay(false); $("status").textContent = ""; if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
player.addEventListener("pause", () => { ikonPlay(true); simpanProgres(true); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; });
player.addEventListener("ended", () => {
  const j = dongeng[aktif].judul; delete progres[j]; LS.set("dongeng.progres", progres);
  $("penutup").style.display = "block";
  tampilBalas();
  if (timer.mode === "habis") { mulaiFade(); return; }
  const sel = cariLain(aktif, 1);
  if ($("autoNext").checked && sel >= 0) buka(sel, true);
});
player.addEventListener("error", () => {
  $("status").textContent = "dongengnyaa belum kuu tambahinn, hehee.";
  ikonPlay(true);
});

/* ---------- suara latar (WebAudio, tanpa file) ---------- */
let ctx = null, master = null, sumber = [], latarAktif = "mati", volLatar = 0.4;
const LATAR = [["mati", "mati"], ["hujan", "hujan"], ["ombak", "ombak"], ["angin", "angin"]];

function buatNoise(jenis){
  const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (jenis === "putih") d[i] = w * 0.6;
    else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
  }
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s;
}
function lfo(hz, kedalaman, target){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = hz; g.gain.value = kedalaman; o.connect(g); g.connect(target); o.start(); return o;
}
function hentiLatar(){
  sumber.forEach(n => { try { n.stop(); } catch {} try { n.disconnect(); } catch {} });
  sumber = [];
}
function setLatar(jenis){
  latarAktif = jenis; hentiLatar();
  [...$("latar").children].forEach(b => b.classList.toggle("aktif", b.dataset.j === jenis));
  $("latarToggle").classList.toggle("aktif", jenis !== "mati");
  $("latarLabel").textContent = jenis === "mati" ? "latar" : jenis;
  if (jenis === "mati") return;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  terapkanVol();
  let n;
  if (jenis === "hujan") {
    n = buatNoise("putih");
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000;
    n.connect(hp); hp.connect(lp); lp.connect(master); n.start(); sumber.push(n, hp, lp);
  } else if (jenis === "ombak") {
    n = buatNoise("coklat");
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
    const g = ctx.createGain(); g.gain.value = 0.55;
    n.connect(lp); lp.connect(g); g.connect(master); n.start();
    sumber.push(n, lp, g, lfo(0.11, 0.4, g.gain));
  } else {
    n = buatNoise("coklat");
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 450; bp.Q.value = 0.6;
    const g = ctx.createGain(); g.gain.value = 0.6;
    n.connect(bp); bp.connect(g); g.connect(master); n.start();
    sumber.push(n, bp, g, lfo(0.07, 0.35, g.gain), lfo(0.05, 120, bp.frequency));
  }
}
function terapkanVol(){ if (master) master.gain.value = volLatar * fadeFaktor; }
LATAR.forEach(([j, t]) => {
  const b = document.createElement("button"); b.innerHTML = ic(j) + " " + t; b.dataset.j = j;
  if (j === "mati") b.classList.add("aktif");
  b.onclick = () => setLatar(j); $("latar").appendChild(b);
});
$("volLatar").oninput = e => { volLatar = e.target.value / 100 * 0.8; terapkanVol(); };
volLatar = 0.4 * 0.8;

/* ---------- timer tidur ---------- */
const timer = { mode: null, akhir: 0, tick: null, fade: null };
function bersihTimer(){
  clearInterval(timer.tick); clearInterval(timer.fade);
  timer.tick = timer.fade = null; timer.mode = null;
  fadeFaktor = 1; player.volume = 1; vn.volume = 1; terapkanVol();
  $("pil").classList.remove("tampil");
}
function tandaiTimer(val){
  [...$("timerTombol").children].forEach(b => b.classList.toggle("aktif", b.dataset.v === String(val)));
  const nyala = !!val;
  $("timerToggle").classList.toggle("aktif", nyala);
  $("timerLabel").textContent = !nyala ? "timer" : val === "habis" ? "habis cerita" : val + " mnt";
}
function atur(v){
  tutupTimer(); bersihTimer(); tandaiTimer(v);
  if (!v) return;
  if (v === "habis") {
    timer.mode = "habis";
    $("pil").textContent = "berhenti setelah cerita selesai"; $("pil").classList.add("tampil");
    return;
  }
  timer.mode = "menit"; timer.akhir = Date.now() + v * 60000;
  const tampil = () => {
    const sisa = timer.akhir - Date.now();
    if (sisa <= 0) { mulaiFade(); return; }
    const s = Math.ceil(sisa / 1000);
    $("pil").textContent = "berhenti dalam " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  $("pil").classList.add("tampil"); tampil();
  timer.tick = setInterval(tampil, 500);
}
function mulaiFade(){
  clearInterval(timer.tick); clearInterval(timer.fade);
  $("pil").textContent = "suaranyaa berkurangg sedikit"; $("pil").classList.add("tampil");
  timer.fade = setInterval(() => {
    fadeFaktor = Math.max(0, fadeFaktor - 0.03);
    player.volume = fadeFaktor; vn.volume = fadeFaktor; terapkanVol();
    if (fadeFaktor <= 0.02) {
      player.pause(); vn.pause(); setLatar("mati"); bersihTimer(); tandaiTimer(0);
      $("status").textContent = "sudaaa berhentii dongengnyaa. bobooo yangg nyenyak yaa cantikk";
    }
  }, 250);
}
MENIT_TIMER.forEach(m => {
  const b = document.createElement("button"); b.textContent = m + " menit"; b.dataset.v = m;
  b.onclick = () => atur(m); $("timerTombol").appendChild(b);
});
[["habis", "habis ceritanya"], [0, "tanpa timer"]].forEach(([v, t]) => {
  const b = document.createElement("button"); b.textContent = t; b.dataset.v = v;
  if (v === 0) b.classList.add("aktif");
  b.onclick = () => atur(v); $("timerTombol").appendChild(b);
});

/* ---------- voice note dari aku (per dongeng, opsional) ---------- */
const vn = $("vn");
function vnIkon(main){
  $("vnIcPlay").toggleAttribute("hidden", !main);
  $("vnIcPause").toggleAttribute("hidden", main);
  $("vnPlay").setAttribute("aria-label", main ? "Putar voice note" : "Jeda voice note");
}
function vnBar(){
  const d = vn.duration || 0, t = vn.currentTime || 0, p = d ? t / d * 100 : 0;
  $("vnIsi").style.width = p + "%"; $("vnTitik").style.left = p + "%";
  $("vnSeek").value = d ? Math.round(t / d * 1000) : 0;
  $("vnWaktu").textContent = fmt(t) + " / " + fmt(d);
}
function pasangVN(d){
  vn.pause();
  const ada = !!(d.vnTeks || d.vn);
  $("vnBlok").hidden = !ada;
  $("vnLabel").innerHTML = d.vn ? ic("mic") + " voice note dari aku" : ic("hati") + " pesan dari aku";
  $("vnTeks").textContent = d.vnTeks || ""; $("vnTeks").hidden = !d.vnTeks;
  $("vnKontrol").hidden = !d.vn;
  if (d.vn) vn.src = d.vn; else { vn.removeAttribute("src"); vn.load(); }
  vnIkon(true); vnBar();
}
$("vnPlay").onclick = () => {
  if (vn.paused) {
    player.pause();
    vn.play().catch(() => { $("status").textContent = "voice note nya belum bisa diputar, coba lagi yaa"; });
  } else vn.pause();
};
$("vnSeek").oninput = e => { if (vn.duration) vn.currentTime = e.target.value / 1000 * vn.duration; };
vn.addEventListener("loadedmetadata", vnBar);
vn.addEventListener("timeupdate", vnBar);
vn.addEventListener("play", () => { vnIkon(false); if (!player.paused) player.pause(); });
vn.addEventListener("pause", () => vnIkon(true));
vn.addEventListener("ended", () => { vnIkon(true); vn.currentTime = 0; vnBar(); });
vn.addEventListener("error", () => { if (vn.getAttribute("src")) { vnIkon(true); $("status").textContent = "voice note nya belum bisa dimuat, hehee."; } });
player.addEventListener("play", () => { if (!vn.paused) vn.pause(); });

/* ---------- buka / kembali ---------- */
function buka(i, langsungPutar){
  aktif = i; const d = dongeng[i];
  document.documentElement.style.setProperty("--acc", aksen(i));
  $("detail").style.setProperty("--acc", aksen(i));
  pasangCover($("dIkon"), d);

  $("penutupIsi").textContent = PENUTUP_ISI + " — " + NAMA_KAMU;
  $("penutup").style.display = "none";
  resetBalas();
  pasangVN(d);
  $("status").textContent = "";
  const p = progres[d.judul];
  pulihPosisi = p && p.t > 3 ? p.t : null;
  terakhir = d.judul; LS.set("dongeng.terakhir", terakhir);
  if (d.file) player.src = d.file;
  else { player.pause(); player.removeAttribute("src"); player.load(); $("status").textContent = "dongengnyaa belum kuu tambahinn, tunggu yaa sayangg, hehee."; }
  player.playbackRate = KEC[kecepatanIdx]; player.volume = fadeFaktor; vn.volume = fadeFaktor;
  perbaruiBar(); ikonPlay(true);
  $("utama").style.display = "none"; $("detail").style.display = "block";

}
$("kembali").onclick = () => {

};

/* ---------- PWA: service worker + tombol pasang ---------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
(function pwa(){
  const sudahTerpasang = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (sudahTerpasang) return;
  let tunda = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); tunda = e; $("pasang").classList.add("tampil");
  });
  $("pasang").onclick = async () => {
    if (!tunda) return;
    tunda.prompt();
    try { await tunda.userChoice; } catch {}
    tunda = null; $("pasang").classList.remove("tampil");
  };
  window.addEventListener("appinstalled", () => { $("pasang").classList.remove("tampil"); $("pasangIos").classList.remove("tampil"); });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) $("pasangIos").classList.add("tampil");
})();

/* ---------- sumber data: Supabase (kalau sudah diisi) atau daftar statis ---------- */
const SB_URL = String(window.SB_URL || "").replace(/\/+$/, "");
const SB_KEY = String(window.SB_KEY || "");
const SB_AKTIF = !!(SB_URL && SB_KEY) && !/GANTI/i.test(SB_URL + SB_KEY);
const urlPublik = p => p ? SB_URL + "/storage/v1/object/public/dongeng/" + p.split("/").map(encodeURIComponent).join("/") : "";
const dariRow = r => ({ id: r.id, ikon: r.ikon || "bintang", judul: r.judul, pembuka: r.pembuka || "", gambar: urlPublik(r.gambar_path), file: urlPublik(r.audio_path), vnTeks: r.vn_teks || "", vn: urlPublik(r.vn_audio_path) });
let memuat = false;

function terapkan(daftar){
  const judulAktif = aktif >= 0 && dongeng[aktif] ? dongeng[aktif].judul : null;
  dongeng = daftar;
  if (judulAktif) { const i = dongeng.findIndex(d => d.judul === judulAktif); if (i >= 0) aktif = i; }
  renderInfo(); gambarDaftar();
}

async function muatDongeng(){
  if (!SB_AKTIF) { terapkan(DONGENG_STATIS); return; }
  const cache = LS.get("dongeng.daftar", null);
  if (Array.isArray(cache) && cache.length) terapkan(cache);
  else { memuat = true; terapkan([]); }
  try {
    const res = await fetch(SB_URL + "/rest/v1/dongeng?select=*&order=urutan.asc,id.asc", { headers: { apikey: SB_KEY } });
    if (!res.ok) throw new Error("status " + res.status);
    const daftar = (await res.json()).map(dariRow);
    LS.set("dongeng.daftar", daftar);
    memuat = false; terapkan(daftar);
  } catch (err) {
    memuat = false;
    if (dongeng.length) gambarDaftar(); else terapkan(DONGENG_STATIS);
  }
}

function tutupLatar(){ $("latarPilihan").hidden = true; $("latarToggle").setAttribute("aria-expanded", "false"); }

/* ---------- balasan buat dia kirim (ala chat) ---------- */
const EMOJI_BALAS = ["❤️", "🥰", "😘", "😍", "😴", "🥹", "😊", "😂", "🤭", "🥺", "😭", "🌙",
                     "⭐", "💕", "💖", "💗", "💤", "💞", "🤗", "😇", "🙈", "💋", "🌹", "✨"];
let sedangKirim = false;

function autoTinggi(){
  const t = $("balasPesan");
  t.style.height = "auto";
  t.style.height = Math.min(112, Math.max(44, t.scrollHeight)) + "px";
}
function tutupTray(){ $("balasTray").hidden = true; $("balasEmojiBtn").setAttribute("aria-expanded", "false"); }
function sisipEmoji(e){
  const t = $("balasPesan");
  const a = typeof t.selectionStart === "number" ? t.selectionStart : t.value.length;
  const z = typeof t.selectionEnd === "number" ? t.selectionEnd : a;
  const baru = t.value.slice(0, a) + e + t.value.slice(z);
  if (baru.length > t.maxLength) return;
  t.value = baru;
  const pos = a + e.length; t.setSelectionRange(pos, pos);
  autoTinggi();
  if (!sedangKirim) $("balasStatus").textContent = "";
}

(function siapBalas(){
  EMOJI_BALAS.forEach(e => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = e; b.setAttribute("aria-label", "Sisipkan " + e);
    b.onclick = () => sisipEmoji(e);
    $("balasTray").appendChild(b);
  });
  $("balasEmojiBtn").onclick = () => {
    const buka = $("balasTray").hidden;
    $("balasTray").hidden = !buka;
    $("balasEmojiBtn").setAttribute("aria-expanded", String(buka));
    if (buka) $("balasTray").scrollIntoView({ block: "nearest", behavior: "smooth" });
    else $("balasPesan").focus();
  };
  $("balasPesan").addEventListener("input", () => { autoTinggi(); if (!sedangKirim) $("balasStatus").textContent = ""; });
  // di komputer Enter = kirim, Shift+Enter = baris baru; di HP Enter = baris baru
  $("balasPesan").addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing && window.matchMedia("(pointer: fine)").matches) {
      e.preventDefault(); kirimBalasan();
    }
  });
  $("balasForm").addEventListener("submit", e => { e.preventDefault(); kirimBalasan(); });
})();

function resetBalas(){
  sedangKirim = false;
  $("balasPesan").value = ""; autoTinggi();
  tutupTray();
  $("balasStatus").textContent = ""; $("balasKirim").disabled = false;
  $("balas").style.display = "none";
}
function tampilBalas(){
  if (!SB_AKTIF) return;
  resetBalas();
  $("balas").style.display = "block";
}
async function kirimBalasan(){
  if (sedangKirim) return;
  const d = dongeng[aktif]; if (!d) return;
  const teks = $("balasPesan").value.trim();
  if (!teks) { $("balasStatus").textContent = "tulis sesuatu dulu yaa"; return; }
  sedangKirim = true; $("balasKirim").disabled = true; $("balasStatus").textContent = "mengirim…";
  try {
    const res = await fetch(SB_URL + "/rest/v1/balasan", {
      method: "POST",
      headers: { apikey: SB_KEY, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ dongeng_id: d.id || null, judul: String(d.judul).slice(0, 160), emoji: "", pesan: teks.slice(0, 500) })
    });
    if (!res.ok) throw new Error("status " + res.status);
    $("balasPesan").value = ""; autoTinggi(); tutupTray();
    $("balasStatus").textContent = "terkirim! makasii yaa sayangg, nanti aku bacaa hehee";
  } catch (err) {
    $("balasStatus").textContent = "yahh gagal kirim, coba lagi yaa";
  }
  sedangKirim = false; $("balasKirim").disabled = false;
}

muatDongeng();
