<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#221a3b">
  <meta name="description" content="dongeng sebelum boboo">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="dongeng boboo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>dongeng sebelum boboo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chewy&family=Baloo+2:wght@400;600;700&display=swap"
    rel="stylesheet">
  <style>
    /* Semua warna SOLID. Tidak ada gradasi di mana pun. */
    :root {
      --malam: #221a3b;
      --malam2: #2d2350;
      --panel: #33275c;
      --chip: #43347a;
      --teks: #fff3e2;
      --redup: #b9aed6;
      --tinta: #2a1d44;
      --pink: #ff9db8;
      --kuning: #ffd36b;
      --mint: #86e0c0;
      --biru: #8fc2ff;
      --jingga: #ffaf7a;
      --acc: var(--pink);
      --gelap: color-mix(in srgb, var(--acc) 62%, #1a0f2e);
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0
    }

    body {
      min-height: 100vh;
      background: var(--malam);
      color: var(--teks);
      font-family: "Baloo 2", system-ui, sans-serif;
      font-size: 1.02rem;
      line-height: 1.5;
      padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 70px);
      -webkit-tap-highlight-color: transparent;
    }

    h1,
    h2,
    .judul {
      font-family: "Chewy", "Baloo 2", system-ui, sans-serif;
      font-weight: 400;
      line-height: 1.15;
      letter-spacing: .01em
    }

    button {
      font: inherit;
      color: inherit
    }

    svg[hidden] {
      display: none
    }

    .ic {
      width: 1.15em;
      height: 1.15em;
      vertical-align: -.2em;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.4;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    .kartu .ikon,
    .sampul .ikon,
    .lanjut .ikon {
      color: var(--tinta)
    }

    /* ikon dongeng dibuat "gemuk": ada isiannya */
    .kartu .ikon .ic,
    .sampul .ikon .ic,
    .lanjut .ikon .ic {
      fill: currentColor;
      fill-opacity: .22
    }

    .kartu .ikon .ic {
      width: 30px;
      height: 30px
    }

    .sampul .ikon .ic {
      width: 58px;
      height: 58px
    }

    .lanjut .ikon .ic {
      width: 30px;
      height: 30px
    }

    .tombol-pojok .ic {
      width: 24px;
      height: 24px
    }

    .panel h3 .ic {
      width: 1.2em;
      height: 1.2em;
      margin-right: 6px;
      color: var(--acc)
    }

    .info .ic {
      width: 1em;
      height: 1em;
      margin-right: 2px
    }

    .penutup .judul .ic {
      width: 1.1em;
      height: 1.1em
    }

    .fav .ic {
      display: none
    }

    main {
      max-width: 540px;
      margin: 0 auto;
      padding: 26px 20px 40px;
      position: relative;
      z-index: 1
    }

    /* ---------- langit ---------- */
    .bintang {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0
    }

    .bintang i {
      position: absolute;
      background: var(--kuning);
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
      animation: kedip 3.4s ease-in-out infinite;
    }

    @keyframes kedip {
      50% {
        opacity: .25;
        transform: scale(.55) rotate(25deg)
      }
    }

    .redupan {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 50;
      transition: opacity .4s
    }

    body.redup .redupan {
      opacity: .45
    }

    /* ---------- header ---------- */
    header {
      text-align: center;
      margin-bottom: 26px;
      position: relative
    }

    .bulan {
      width: 108px;
      height: 108px;
      margin: 8px auto 14px;
      border-radius: 50%;
      background: var(--kuning);
      position: relative;
      transform: rotate(-8deg);
      animation: goyang 6s ease-in-out infinite;
    }

    @keyframes goyang {
      50% {
        transform: rotate(6deg)
      }
    }

    /* mata ngantuk */
    .bulan::before,
    .bulan::after {
      content: "";
      position: absolute;
      top: 46px;
      width: 15px;
      height: 8px;
      border-bottom: 4px solid var(--tinta);
      border-radius: 0 0 15px 15px;
    }

    .bulan::before {
      left: 27px
    }

    .bulan::after {
      right: 27px
    }

    .bulan span {
      position: absolute;
      left: 50%;
      top: 66px;
      width: 12px;
      height: 12px;
      margin-left: -6px;
      border-radius: 50%;
      background: var(--tinta);
    }

    .bulan b {
      position: absolute;
      top: 60px;
      width: 17px;
      height: 11px;
      border-radius: 50%;
      background: var(--pink);
      opacity: .85
    }

    .bulan b:nth-of-type(1) {
      left: 12px
    }

    .bulan b:nth-of-type(2) {
      right: 12px
    }

    .zz {
      position: absolute;
      left: calc(50% + 52px);
      top: -4px;
      font-family: "Chewy", sans-serif;
      color: var(--biru);
      font-size: 1.9rem;
      pointer-events: none;
      transform: rotate(10deg);
      animation: melayang 3.2s ease-in-out infinite;
    }

    .zz i {
      font-style: normal;
      font-size: 1.2rem;
      margin-left: 2px;
      color: var(--mint)
    }

    @keyframes melayang {
      50% {
        transform: translateY(-8px) rotate(2deg)
      }
    }

    h1 {
      font-size: 2.3rem;
      margin: 0 0 2px;
      color: var(--kuning);
      transform: rotate(-1.5deg);
    }

    .sapa {
      margin: 0;
      color: var(--redup)
    }

    .chips-info {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 12px
    }

    .info {
      background: var(--chip);
      border-radius: 14px 14px 14px 5px;
      padding: 3px 12px;
      font-size: .9rem;
      font-weight: 600;
      color: var(--kuning);
    }

    .info:nth-child(2) {
      border-radius: 14px 14px 5px 14px;
      color: var(--pink)
    }

    .tombol-pojok {
      position: absolute;
      right: 0;
      top: 0;
      width: 46px;
      height: 46px;
      border-radius: 16px 16px 16px 6px;
      background: var(--chip);
      border: 0;
      cursor: pointer;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .tombol-pojok:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .tombol-pojok[aria-pressed="true"] {
      background: var(--kuning);
      color: var(--tinta)
    }

    /* ---------- pesan malam: kertas sticky ---------- */
    .pesan {
      background: var(--kuning);
      color: var(--tinta);
      border-radius: 6px 6px 22px 6px;
      padding: 18px 20px 16px;
      margin: 0 6px 24px;
      transform: rotate(1.3deg);
      position: relative;
      box-shadow: 4px 6px 0 rgba(0, 0, 0, .22);
    }

    .pesan::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 70px;
      height: 20px;
      margin-left: -35px;
      background: var(--pink);
      opacity: .9;
      transform: rotate(-4deg);
    }

    .pesan small {
      display: block;
      font-family: "Chewy", sans-serif;
      color: #a8521f;
      font-size: .95rem;
      margin-bottom: 0
    }

    .pesan p {
      margin: 0;
      font-weight: 600;
      line-height: 1.4
    }

    /* ---------- lanjutkan ---------- */
    .lanjut {
      display: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
      margin-bottom: 22px;
      background: var(--mint);
      color: var(--tinta);
      border: 0;
      border-radius: 28px 28px 8px 28px;
      padding: 14px 18px;
      align-items: center;
      gap: 14px;
      box-shadow: 0 6px 0 #4aa88a;
      transition: transform .1s, box-shadow .1s;
    }

    .lanjut:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #4aa88a
    }

    .lanjut.tampil {
      display: flex
    }

    .lanjut small {
      display: block;
      font-weight: 700;
      opacity: .75;
      line-height: 1.2
    }

    .lanjut .judul {
      font-size: 1.25rem;
      display: block
    }

    .lanjut svg {
      margin-left: auto;
      flex: none
    }

    /* ---------- cari & filter ---------- */
    .alat {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap
    }

    .cari {
      flex: 1 1 180px;
      min-width: 0;
      background: white;
      color: var(--teks);
      border: 0;
      border-radius: 20px 20px 20px 6px;
      padding: 11px 18px;
      font: inherit;
      font-weight: 600;
    }

    .cari::placeholder {
      color: var(--redup);
      font-weight: 400
    }

    .cari:focus {
      outline: 3px solid var(--pink);
      outline-offset: 2px
    }

    .filter {
      display: flex;
      gap: 8px
    }

    .filter button {
      background: var(--chip);
      border: 0;
      border-radius: 18px 18px 6px 18px;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: 700;
      color: var(--redup);
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .filter button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .filter button.aktif {
      background: var(--pink);
      color: var(--tinta)
    }

    /* ---------- daftar: kartu warna-warni tanpa garis ---------- */
    .daftar {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 16px
    }

    .daftar li {
      position: relative
    }

    .kartu {
      width: 100%;
      display: flex;
      gap: 14px;
      align-items: center;
      text-align: left;
      background: var(--acc);
      color: var(--tinta);
      border: 0;
      border-radius: 34px 18px 34px 18px / 26px 30px 24px 32px;
      padding: 14px 62px 14px 14px;
      cursor: pointer;
      transform: rotate(-.7deg);
      transition: transform .18s cubic-bezier(.3, 1.6, .5, 1);
    }

    .daftar li:nth-child(even) .kartu {
      transform: rotate(.6deg);
      border-radius: 18px 34px 18px 34px / 30px 24px 32px 26px;
    }

    /* hanya sebagian kartu yang punya garis putus-putus, sisanya polos */
    .daftar li:nth-child(3n) .kartu {
      background: transparent;
      color: var(--teks);
      outline: 3px dashed var(--acc);
      outline-offset: -3px;
    }

    .daftar li:nth-child(3n) .kartu small {
      color: var(--redup)
    }

    .daftar li:nth-child(3n) .kartu .ikon {
      background: var(--acc)
    }

    .daftar li:nth-child(3n) .mini {
      background: var(--malam2)
    }

    .daftar li:nth-child(3n) .mini i {
      background: var(--acc)
    }

    .daftar li:nth-child(3n) .fav svg {
      stroke: var(--redup)
    }

    .kartu:hover,
    .kartu:focus-visible {
      transform: rotate(0) scale(1.03) !important;
      outline-color: var(--acc);
    }

    .kartu:focus-visible {
      outline: 3px solid var(--teks);
      outline-offset: 3px
    }

    .kartu:active {
      transform: scale(.97) !important
    }

    .kartu .ikon {
      flex: none;
      width: 58px;
      height: 58px;
      border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%;
      background: rgba(255, 255, 255, .55);
      display: grid;
      place-items: center;
    }

    .kartu .judul {
      font-size: 1.3rem;
      display: block
    }

    .kartu small {
      color: rgba(42, 29, 68, .72);
      display: block;
      font-weight: 600;
      line-height: 1.2
    }

    .mini {
      height: 7px;
      border-radius: 7px;
      background: rgba(42, 29, 68, .18);
      margin-top: 8px;
      overflow: hidden;
      display: none
    }

    .mini.tampil {
      display: block
    }

    .mini i {
      display: block;
      height: 100%;
      background: var(--tinta);
      border-radius: 7px
    }

    .fav {
      position: absolute;
      right: 10px;
      top: 50%;
      margin-top: -22px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .fav svg {
      width: 26px;
      height: 26px;
      fill: none;
      stroke: var(--tinta);
      stroke-width: 2.4;
      stroke-linejoin: round;
      transition: transform .2s cubic-bezier(.3, 1.8, .5, 1)
    }

    .fav[aria-pressed="true"] svg {
      fill: #e0245e;
      stroke: #e0245e;
      transform: scale(1.2) rotate(-8deg)
    }

    .fav:focus-visible {
      outline: 3px solid var(--teks)
    }

    .kosong {
      text-align: center;
      color: var(--redup);
      padding: 26px 0;
      display: none
    }

    /* ---------- cover dongeng (gambar dari dongengnya, fallback ke ikon) ---------- */
    .kartu .ikon,
    .sampul .ikon {
      position: relative;
      overflow: hidden
    }

    .ikon img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .kartu .ikon.ada-gambar {
      width: 70px;
      height: 70px
    }

    .sampul .ikon.ada-gambar {
      width: 176px;
      height: 176px;
      margin-bottom: 16px
    }

    .kartu.segera {
      opacity: .78
    }

    .daftar li:nth-child(3n) .kartu.segera {
      opacity: .85
    }

    /* tombol pasang aplikasi (muncul kalau browser mendukung) */
    .pasang {
      display: none;
      margin: 14px auto 0;
      background: var(--mint);
      color: var(--tinta);
      border: 0;
      border-radius: 18px 18px 18px 6px;
      padding: 7px 18px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 #4aa88a;
      transition: transform .1s, box-shadow .1s
    }

    .pasang.tampil {
      display: block
    }

    .pasang:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #4aa88a
    }

    .pasang-ios {
      display: none;
      margin: 12px auto 0;
      max-width: 330px;
      background: var(--malam2);
      border-radius: 18px;
      padding: 8px 14px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--redup)
    }

    .pasang-ios.tampil {
      display: block
    }

    /* ---------- detail ---------- */
    #detail {
      display: none
    }

    .kembali {
      background: var(--chip);
      border: 0;
      color: var(--teks);
      cursor: pointer;
      padding: 6px 16px;
      margin-bottom: 14px;
      border-radius: 16px 16px 16px 5px;
      font-weight: 700;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .kembali:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    button:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 3px
    }

    .sampul {
      text-align: center
    }

    .sampul .ikon {
      width: 112px;
      height: 112px;
      border-radius: 42% 58% 55% 45% / 50% 45% 55% 50%;
      background: var(--acc);
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      transform: rotate(-5deg);
    }

    .sampul h2 {
      font-size: 2rem;
      margin: 0 0 18px;
      color: var(--acc)
    }

    /* pembuka = gelembung bicara */
    .pembuka {
      background: var(--malam2);
      border-radius: 26px 26px 26px 26px;
      padding: 16px 20px;
      margin: 0 0 30px;
      color: var(--teks);
      font-weight: 600;
      position: relative;
    }

    .pembuka::after {
      content: "";
      position: absolute;
      left: 34px;
      bottom: -16px;
      width: 26px;
      height: 20px;
      background: var(--malam2);
      clip-path: polygon(0 0, 100% 0, 0 100%);
    }

    .panel {
      background: var(--panel);
      border-radius: 28px 28px 28px 10px;
      padding: 18px 18px 20px;
      margin-bottom: 18px
    }

    .panel:nth-of-type(even) {
      border-radius: 28px 28px 10px 28px
    }

    .panel h3 {
      margin: 0 0 12px;
      font-family: "Chewy", sans-serif;
      font-weight: 400;
      font-size: 1.15rem;
      line-height: 1.25;
      color: var(--teks)
    }

    /* pemutar */
    .bar {
      position: relative;
      height: 34px;
      display: flex;
      align-items: center
    }

    .bar .jalur {
      position: absolute;
      left: 0;
      right: 0;
      height: 14px;
      border-radius: 14px;
      background: var(--malam)
    }

    .bar .isi {
      position: absolute;
      left: 0;
      height: 14px;
      border-radius: 14px;
      background: var(--acc);
      width: 0
    }

    .bar .titik {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--teks);
      margin-left: -13px;
      left: 0;
      box-shadow: 0 3px 0 var(--gelap)
    }

    .bar input {
      position: absolute;
      inset: 0;
      width: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer
    }

    .bar:focus-within .titik {
      outline: 3px solid var(--teks);
      outline-offset: 2px
    }

    .waktu {
      display: flex;
      justify-content: space-between;
      font-size: .9rem;
      font-weight: 600;
      color: var(--redup);
      font-variant-numeric: tabular-nums
    }

    .kontrol {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 12px
    }

    .kontrol button {
      background: var(--chip);
      border: 0;
      cursor: pointer;
      width: 54px;
      height: 54px;
      border-radius: 20px 20px 20px 8px;
      display: grid;
      place-items: center;
      position: relative;
      box-shadow: 0 5px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .kontrol button:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #17102b
    }

    .kontrol button svg {
      width: 28px;
      height: 28px;
      fill: var(--teks)
    }

    .kontrol button small {
      position: absolute;
      font-size: .62rem;
      font-weight: 700;
      top: 19px;
      left: 0;
      right: 0;
      text-align: center
    }

    .kontrol .main {
      width: 76px;
      height: 76px;
      background: var(--acc);
      border-radius: 50% 50% 50% 22%;
      box-shadow: 0 6px 0 var(--gelap);
    }

    .kontrol .main:active {
      box-shadow: 0 2px 0 var(--gelap)
    }

    .kontrol .main svg {
      width: 34px;
      height: 34px;
      fill: var(--tinta)
    }

    .kecepatan {
      width: auto !important;
      height: 40px !important;
      padding: 0 18px;
      border-radius: 16px 16px 16px 6px !important;
      font-weight: 700;
      font-size: .95rem;
      box-shadow: 0 4px 0 #17102b !important;
    }

    /* chip pilihan */
    .pilih {
      display: flex;
      gap: 9px;
      flex-wrap: wrap
    }

    .pilih button {
      background: var(--chip);
      border: 0;
      border-radius: 16px 16px 16px 6px;
      padding: 7px 16px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 4px 0 #17102b;
      transition: transform .1s, box-shadow .1s;
    }

    .pilih button:nth-child(even) {
      border-radius: 16px 16px 6px 16px
    }

    .pilih button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #17102b
    }

    .pilih button.aktif {
      background: var(--acc);
      color: var(--tinta);
      box-shadow: 0 4px 0 var(--gelap)
    }

    .volume {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      color: var(--redup);
      font-size: .9rem;
      font-weight: 600
    }

    .volume input {
      flex: 1;
      accent-color: var(--acc)
    }

    .sakelar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-weight: 700
    }

    .sakelar input {
      position: absolute;
      opacity: 0
    }

    .sakelar .rel {
      width: 56px;
      height: 32px;
      border-radius: 32px;
      background: var(--malam);
      position: relative;
      flex: none;
      transition: background .2s
    }

    .sakelar .rel::after {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--redup);
      transition: transform .25s cubic-bezier(.3, 1.7, .5, 1), background .2s
    }

    .sakelar input:checked+.rel {
      background: var(--mint)
    }

    .sakelar input:checked+.rel::after {
      transform: translateX(24px);
      background: var(--tinta)
    }

    .sakelar input:focus-visible+.rel {
      outline: 3px solid var(--pink);
      outline-offset: 3px
    }

    #status {
      min-height: 1.6em;
      margin: 0 0 16px;
      color: var(--kuning);
      font-weight: 600;
      text-align: center
    }

    .penutup {
      display: none;
      text-align: center;
      padding: 22px 20px;
      border-radius: 30px 30px 8px 30px;
      background: var(--pink);
      color: var(--tinta);
      font-weight: 600;
      transform: rotate(-1deg);
    }

    .penutup .judul {
      font-size: 1.5rem;
      display: block;
      margin-bottom: 4px
    }

    /* pil timer melayang */
    .pil {
      position: fixed;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom) + 16px);
      transform: translateX(-50%);
      background: var(--kuning);
      color: var(--tinta);
      border-radius: 18px 18px 18px 6px;
      padding: 7px 18px;
      font-weight: 700;
      z-index: 40;
      display: none;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 4px 0 #b88b1c;
    }

    .pil.tampil {
      display: block
    }

    footer {
      text-align: center;
      color: var(--redup);
      font-weight: 600;
      margin-top: 40px
    }

    @media (prefers-reduced-motion:reduce) {

      .bintang i,
      .bulan,
      .zz {
        animation: none
      }

      .kartu,
      .fav svg,
      .redupan,
      button {
        transition: none
      }
    }
  </style>
</head>

const ic = n => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICON[n] || ICON.bintang) + '</svg>';

  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

let progres = LS.get("dongeng.progres", {});   // { judul: {t, d} }
let terakhir = LS.get("dongeng.terakhir", null);

}

/* cover dongeng: pakai gambar kalau ada, kalau belum ada atau gagal dimuat tetap pakai ikon */
function pasangCover(el, d){
  el.classList.remove("ada-gambar");
  el.innerHTML = ic(d.ikon);
  if (!d.gambar) return;
  const img = new Image();
  img.alt = ""; img.decoding = "async";
  img.onload = () => { el.classList.add("ada-gambar"); el.innerHTML = ""; el.appendChild(img); };
  img.src = d.gambar;
}
const adaFile = i => !!(dongeng[i] && dongeng[i].file);
function cariLain(i, arah){
  for (let k = i + arah; k >= 0 && k < dongeng.length; k += arah) if (adaFile(k)) return k;
  return -1;
}

const fmt = s => {
  if (!isFinite(s)) return "0:00";
  s = Math.floor(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
};

/* ---------- daftar ---------- */
function gambarDaftar(){
  const ul = $("daftar"); ul.innerHTML = "";
  let n = 0;
  dongeng.forEach((d, i) => {
    if (filterMode === "fav" && !favs.includes(d.judul)) return;
    if (kataCari && !d.judul.toLowerCase().includes(kataCari)) return;
    n++;
    const li = document.createElement("li");
    li.style.setProperty("--acc", aksen(i));
    const b = document.createElement("button");
    b.className = "kartu" + (d.file ? "" : " segera");
    b.innerHTML = '<span class="ikon"></span><span style="flex:1;min-width:0"><span class="judul"></span><small></small><span class="mini"><i></i></span></span>';
    pasangCover(b.querySelector(".ikon"), d);
    b.querySelector(".judul").textContent = d.judul;
    const p = progres[d.judul];
    b.querySelector("small").textContent = !d.file ? "segera hadir" : (p && p.t > 3 ? "lanjut dari " + fmt(p.t) : "Ketuk untuk dengerin");
    if (p && p.d && p.t > 3) {
      const m = b.querySelector(".mini"); m.classList.add("tampil");
      m.firstChild.style.width = Math.min(100, p.t / p.d * 100) + "%";
    }
    b.onclick = () => buka(i);
    const f = document.createElement("button");
    f.className = "fav"; f.setAttribute("aria-label", "Favorit: " + d.judul);
    f.setAttribute("aria-pressed", favs.includes(d.judul));
    f.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.5-9.2C1.1 8.4 3 5 6.4 5c2 0 3.6 1.1 4.6 2.7h2C14 6.1 15.600 5 17.600 5 21 5 22.900 8.400 21.500 11.800 19.500 16.400 12 21 12 21z"/></svg>';
    f.onclick = () => { toggleFav(d.judul); };
    li.append(b, f); ul.appendChild(li);
  });
  $("kosong").style.display = n ? "none" : "block";
  $("kosong").textContent = filterMode === "fav" && !kataCari ? "yahh belum adaa yang kamuu jadiin favorit. ketuk ikon hati nyaa di dongeng yang kamu sukaa, kaloo perluu semuanyaa, hahahaha." : "belum ada yang cocok.";
  // tombol lanjutkan
  const t = dongeng.findIndex(d => d.judul === terakhir);
  const L = $("lanjut");
  if (t >= 0 && progres[terakhir] && progres[terakhir].t > 3) {
    $("lanjutIkon").innerHTML = ic(dongeng[t].ikon);
    $("lanjutJudul").textContent = dongeng[t].judul;
    $("lanjutKet").textContent = "lanjutkan dari " + fmt(progres[terakhir].t);
    L.classList.add("tampil"); L.onclick = () => buka(t, true);
  } else L.classList.remove("tampil");
}
function toggleFav(j){
  favs = favs.includes(j) ? favs.filter(x => x !== j) : [...favs, j];
  LS.set("dongeng.fav", favs); gambarDaftar();
}
$("cari").oninput = e => { kataCari = e.target.value.trim().toLowerCase(); gambarDaftar(); };
$("filter").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  filterMode = b.dataset.f;
  [...$("filter").children].forEach(x => x.classList.toggle("aktif", x === b));
  gambarDaftar();
};

/* ---------- mode redup ---------- */
function setRedup(on){
  document.body.classList.toggle("redup", on);
  $("redup").setAttribute("aria-pressed", on); LS.set("dongeng.redup", on);
}
$("redup").onclick = () => setRedup(!document.body.classList.contains("redup"));
setRedup(LS.get("dongeng.redup", false));

/* ---------- pemutar ---------- */
let kecepatanIdx = 1; const KEC = [0.8, 1, 1.25, 1.5];
let pulihPosisi = null, simpanTerakhir = 0;

function ikonPlay(main){
  $("icPlay").toggleAttribute("hidden", !main);
  $("icPause").toggleAttribute("hidden", main);
  $("putar").setAttribute("aria-label", main ? "Putar" : "Jeda");
}
  
function perbaruiBar(){
  const d = player.duration || 0, t = player.currentTime || 0;
  const p = d ? t / d * 100 : 0;
  $("isi").style.width = p + "%"; $("titik").style.left = p + "%";
  $("seek").value = d ? Math.round(t / d * 1000) : 0;
  $("tNow").textContent = fmt(t); $("tDur").textContent = fmt(d);
}
function simpanProgres(paksa){
  if (aktif < 0 || !player.duration) return;
  const now = Date.now(); if (!paksa && now - simpanTerakhir < 2000) return;
  simpanTerakhir = now;
  const j = dongeng[aktif].judul;
  progres[j] = { t: player.currentTime, d: player.duration };
  terakhir = j; LS.set("dongeng.progres", progres); LS.set("dongeng.terakhir", j);
}
function sesiMedia(){
  if (!("mediaSession" in navigator) || aktif < 0) return;
  try {
    const dd = dongeng[aktif];
    navigator.mediaSession.metadata = new MediaMetadata({
      title: dd.judul, artist: NAMA_KAMU, album: "dongeng sebelum boboo",
      artwork: dd.gambar ? [{ src: dd.gambar }] : []
    });
    navigator.mediaSession.setActionHandler("play", () => player.play());
    navigator.mediaSession.setActionHandler("pause", () => player.pause());
    navigator.mediaSession.setActionHandler("seekbackward", () => geser(-15));
    navigator.mediaSession.setActionHandler("seekforward", () => geser(15));
    const sel = cariLain(aktif, 1), sbl = cariLain(aktif, -1);
    navigator.mediaSession.setActionHandler("nexttrack", sel >= 0 ? () => buka(sel, true) : null);
    navigator.mediaSession.setActionHandler("previoustrack", sbl >= 0 ? () => buka(sbl, true) : null);
  } catch {}
}
function geser(s){ if (player.duration) player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + s)); }

$("putar").onclick = () => player.paused ? player.play().catch(() => {}) : player.pause();
$("mundur").onclick = () => geser(-15);
$("maju").onclick = () => geser(15);
$("kecepatan").onclick = () => {
  kecepatanIdx = (kecepatanIdx + 1) % KEC.length;
  player.playbackRate = KEC[kecepatanIdx];
  $("kecepatan").textContent = KEC[kecepatanIdx] + "×";
};
$("seek").oninput = e => { if (player.duration) player.currentTime = e.target.value / 1000 * player.duration; };

player.addEventListener("loadedmetadata", () => {
  if (pulihPosisi != null && pulihPosisi < player.duration - 3) player.currentTime = pulihPosisi;
  pulihPosisi = null; perbaruiBar();
});
player.addEventListener("timeupdate", () => { perbaruiBar(); simpanProgres(false); });
player.addEventListener("play", () => { ikonPlay(false); $("status").textContent = ""; if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "playing"; });
player.addEventListener("pause", () => { ikonPlay(true); simpanProgres(true); if ("mediaSession" in navigator) navigator.mediaSession.playbackState = "paused"; });
player.addEventListener("ended", () => {
  const j = dongeng[aktif].judul; delete progres[j]; LS.set("dongeng.progres", progres);
  $("penutup").style.display = "block";
  if (timer.mode === "habis") { mulaiFade(); return; }
  const sel = cariLain(aktif, 1);
  if ($("autoNext").checked && sel >= 0) buka(sel, true);
});
player.addEventListener("error", () => {
  $("status").textContent = "dongengnyaa belum kuu tambahinn, hehee.";
  ikonPlay(true);
});

/* ---------- suara latar (WebAudio, tanpa file) ---------- */
let ctx = null, master = null, sumber = [], latarAktif = "mati", volLatar = 0.4;
const LATAR = [["mati", "mati"], ["hujan", "hujan"], ["ombak", "ombak"], ["angin", "angin"]];

function buatNoise(jenis){
  const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    if (jenis === "putih") d[i] = w * 0.6;
    else { last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
  }
  const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; return s;
}
function lfo(hz, kedalaman, target){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = hz; g.gain.value = kedalaman; o.connect(g); g.connect(target); o.start(); return o;
}
function hentiLatar(){
  sumber.forEach(n => { try { n.stop(); } catch {} try { n.disconnect(); } catch {} });
  sumber = [];
}
function setLatar(jenis){
  latarAktif = jenis; hentiLatar();
  [...$("latar").children].forEach(b => b.classList.toggle("aktif", b.dataset.j === jenis));
  if (jenis === "mati") return;
  if (!ctx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.connect(ctx.destination);
  }
  if (ctx.state === "suspended") ctx.resume();
  terapkanVol();
  let n;
  if (jenis === "hujan") {
    n = buatNoise("putih");
    const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000;
    n.connect(hp); hp.connect(lp); lp.connect(master); n.start(); sumber.push(n, hp, lp);
  } else if (jenis === "ombak") {
    n = buatNoise("coklat");
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600;
    const g = ctx.createGain(); g.gain.value = 0.55;
    n.connect(lp); lp.connect(g); g.connect(master); n.start();
    sumber.push(n, lp, g, lfo(0.11, 0.4, g.gain));
  } else {
    n = buatNoise("coklat");
    const bp = ctx.createBiquadFilter(); bp.type = "bandpass"; bp.frequency.value = 450; bp.Q.value = 0.6;
    const g = ctx.createGain(); g.gain.value = 0.6;
    n.connect(bp); bp.connect(g); g.connect(master); n.start();
    sumber.push(n, bp, g, lfo(0.07, 0.35, g.gain), lfo(0.05, 120, bp.frequency));
  }
}
function terapkanVol(){ if (master) master.gain.value = volLatar * fadeFaktor; }
LATAR.forEach(([j, t]) => {
  const b = document.createElement("button"); b.innerHTML = ic(j) + " " + t; b.dataset.j = j;
  if (j === "mati") b.classList.add("aktif");
  b.onclick = () => setLatar(j); $("latar").appendChild(b);
});
$("volLatar").oninput = e => { volLatar = e.target.value / 100 * 0.8; terapkanVol(); };
volLatar = 0.4 * 0.8;

/* ---------- timer tidur ---------- */
const timer = { mode: null, akhir: 0, tick: null, fade: null };
function bersihTimer(){
  clearInterval(timer.tick); clearInterval(timer.fade);
  timer.tick = timer.fade = null; timer.mode = null;
  fadeFaktor = 1; player.volume = 1; terapkanVol();
  $("pil").classList.remove("tampil");
}
function tandaiTimer(val){
  [...$("timerTombol").children].forEach(b => b.classList.toggle("aktif", b.dataset.v === String(val)));
}
function atur(v){
  bersihTimer(); tandaiTimer(v);
  if (!v) return;
  if (v === "habis") {
    timer.mode = "habis";
    $("pil").textContent = "berhenti setelah cerita selesai"; $("pil").classList.add("tampil");
    return;
  }
  timer.mode = "menit"; timer.akhir = Date.now() + v * 60000;
  const tampil = () => {
    const sisa = timer.akhir - Date.now();
    if (sisa <= 0) { mulaiFade(); return; }
    const s = Math.ceil(sisa / 1000);
    $("pil").textContent = "berhenti dalam " + Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  };
  $("pil").classList.add("tampil"); tampil();
  timer.tick = setInterval(tampil, 500);
}
function mulaiFade(){
  clearInterval(timer.tick); clearInterval(timer.fade);
  $("pil").textContent = "suaranyaa berkurangg sedikit"; $("pil").classList.add("tampil");
  timer.fade = setInterval(() => {
    fadeFaktor = Math.max(0, fadeFaktor - 0.03);
    player.volume = fadeFaktor; terapkanVol();
    if (fadeFaktor <= 0.02) {
      player.pause(); setLatar("mati"); bersihTimer(); tandaiTimer(0);
      $("status").textContent = "sudaaa berhentii dongengnyaa. bobooo yangg nyenyak yaa cantikk";
    }
  }, 250);
}
MENIT_TIMER.forEach(m => {
  const b = document.createElement("button"); b.textContent = m + " menit"; b.dataset.v = m;
  b.onclick = () => atur(m); $("timerTombol").appendChild(b);
});
[["habis", "habis ceritanya"], [0, "tanpa timer"]].forEach(([v, t]) => {
  const b = document.createElement("button"); b.textContent = t; b.dataset.v = v;
  if (v === 0) b.classList.add("aktif");
  b.onclick = () => atur(v); $("timerTombol").appendChild(b);
});

/* ---------- buka / kembali ---------- */
function buka(i, langsungPutar){
  aktif = i; const d = dongeng[i];
  document.documentElement.style.setProperty("--acc", aksen(i));
  $("detail").style.setProperty("--acc", aksen(i));
  pasangCover($("dIkon"), d);
  $("dJudul").textContent = d.judul;
  $("dPembuka").textContent = d.pembuka;
  $("penutupJudul").textContent = PENUTUP_JUDUL;
  $("penutupIsi").textContent = PENUTUP_ISI + " — " + NAMA_KAMU;
  $("penutup").style.display = "none";
  $("status").textContent = "";
  const p = progres[d.judul];
  pulihPosisi = p && p.t > 3 ? p.t : null;
  terakhir = d.judul; LS.set("dongeng.terakhir", terakhir);
  if (d.file) player.src = d.file;
  else { player.pause(); player.removeAttribute("src"); player.load(); $("status").textContent = "dongengnyaa belum kuu tambahinn, tunggu yaa sayangg, hehee."; }
  player.playbackRate = KEC[kecepatanIdx]; player.volume = fadeFaktor;
  perbaruiBar(); ikonPlay(true);
  $("utama").style.display = "none"; $("detail").style.display = "block";
  window.scrollTo(0, 0); sesiMedia();
  if (langsungPutar) player.play().catch(() => {});
}
$("kembali").onclick = () => {
  player.pause(); simpanProgres(true);
  $("detail").style.display = "none"; $("utama").style.display = "block";
  aktif = -1; gambarDaftar(); window.scrollTo(0, 0);
};

/* kontrol keyboard */
document.addEventListener("keydown", e => {
  if (aktif < 0 || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.code === "Space") { e.preventDefault(); $("putar").click(); }
  if (e.code === "ArrowLeft") geser(-15);
  if (e.code === "ArrowRight") geser(15);
});

/* ---------- PWA: service worker + tombol pasang ---------- */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
(function pwa(){
  const sudahTerpasang = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (sudahTerpasang) return;
  let tunda = null;
  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault(); tunda = e; $("pasang").classList.add("tampil");
  });
  $("pasang").onclick = async () => {
    if (!tunda) return;
    tunda.prompt();
    try { await tunda.userChoice; } catch {}
    tunda = null; $("pasang").classList.remove("tampil");
  };
  window.addEventListener("appinstalled", () => { $("pasang").classList.remove("tampil"); $("pasangIos").classList.remove("tampil"); });
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) $("pasangIos").classList.add("tampil");
})();

gambarDaftar();
</script>
